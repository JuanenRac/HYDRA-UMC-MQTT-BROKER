<title id="t">HYDRA-UMC-MQTT-BROKER architecture</title>
<desc id="d">HYDRA-UMC-MQTT-BROKER accepts MQTT clients on port 1883, authenticates them when a credential file is configured, filters topics with ACLs and exposes metrics.</desc>
